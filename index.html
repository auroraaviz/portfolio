      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body { background: #03000a; overflow-x: hidden; }

      @keyframes hintAppear {
        from { opacity: 0; }
        to   { opacity: 0.35; }
      }
      .hint-text {
        opacity: 0;
        animation: hintAppear 0.6s ease 1.4s forwards;

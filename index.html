<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=DM+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <title>Aurora Ávila — Desarrolladora Web</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #03000a; overflow-x: hidden; }

      @keyframes hintAppear {
        from { opacity: 0; }
        to   { opacity: 0.35; }
      }
      .hint-text {
        opacity: 0;
        animation: hintAppear 0.6s ease 1.4s forwards;
      }
      .hint-text:hover { opacity: 0.7; }
      .hint-text.clicked {
        opacity: 0 !important;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
